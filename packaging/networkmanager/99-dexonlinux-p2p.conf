# Keep NetworkManager away from the Wi-Fi P2P device.
#
# DexOnLinux owns the P2P group through wpa_supplicant's ctrl_iface while
# NetworkManager continues to manage the normal station (internet) connection.
# NetworkManager's P2P path otherwise removes externally created groups right
# after P2P-GROUP-STARTED and cannot force a 2.4 GHz operating channel.
#
# This is a strict unmanaged setting: it cannot be overruled with
# `nmcli device set ... managed yes`. A reboot (or NM restart) is required
# after installing it.
[keyfile]
unmanaged-devices=interface-name:p2p-dev-*;type:wifi-p2p
