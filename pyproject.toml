[project]
name = "dexonlinux"
version = "1.0.2"
description = "Stream Samsung DeX to a Linux desktop over Wi-Fi Direct."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["samsung", "dex", "linux", "scrcpy", "wifi-direct", "wfd", "miracast"]
authors = [
    { name = "gabdevele", email = "me@gabdevele.dev" }
]
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: System :: Networking",
]
dependencies = [
    "colorama==0.4.6",
]

[project.scripts]
dexonlinux = "dexonlinux.main:main"
dexonlinux-linkd = "dexonlinux.helper.__main__:main"

[project.urls]
Homepage = "https://github.com/gabdevele/DexOnLinux"
Repository = "https://github.com/gabdevele/DexOnLinux"
Issues = "https://github.com/gabdevele/DexOnLinux/issues"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "twine>=5.0.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dexonlinux = ["assets/*.png"]
