name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} --only-group dev ruff check src tests

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} --group dev pytest -q
